# Konfigurasi evaluasi kuantitatif (Checkpoint CP04 & CP10)
# Nilai ini dipakai oleh src/metrics.py, src/evaluate_baseline.py,
# src/benchmark_inference.py, dan src/evaluate_experiments.py.

evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.50
  nms_iou: 0.45
  img_size: 640
  realtime_fps_target: 20.0
  warmup_iterations: 5
  bootstrap_samples: 2000
  confidence_level: 0.95
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
