<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1 class="site-title">{{ app_title }}</h1>
        <p class="site-subtitle">Proyek Akhir Visi Komputer (IF0PP006) &mdash; Kelompok 09</p>
      </div>
    </div>
    <nav class="site-nav">
      <div class="container nav-inner">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Demo Inferensi</a>
        <a href="{{ url_for('results_page') }}" class="{% if request.endpoint == 'results_page' %}active{% endif %}">Hasil Eksperimen</a>
        <a href="{{ url_for('failures_page') }}" class="{% if request.endpoint == 'failures_page' %}active{% endif %}">Analisis Kasus Gagal</a>
        <a href="{{ url_for('about_page') }}" class="{% if request.endpoint == 'about_page' %}active{% endif %}">Tim &amp; Informasi</a>
      </div>
    </nav>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Kelompok 09 &mdash; Low-Light Pedestrian Detection. Antarmuka berbasis Flask.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
